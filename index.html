<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="An independently developed, fictional first-person 3D 911 dispatch simulator inspired by White County, Illinois (not affiliated with any real agency). Answer calls, talk to callers, and manage Police, Fire, EMS and dozens of specialized units.">
  <title>911 Dispatch Simulator</title>
  <meta name="apple-mobile-web-app-title" content="911 Dispatch">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="911 Dispatch">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cad.css">
</head>
<body>
  <div id="app">
    <canvas id="world" aria-label="3D dispatch center"></canvas>
    <div id="hud"></div>
    <div id="mobile-controls" hidden></div>
    <div id="cad" hidden></div>
    <div id="menu" hidden></div>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <div id="loading">
    <img class="load-logo" src="icon.svg" alt="" width="132" height="132">
    <div class="logo">911 <span style="color:#ff5a4e">DISPATCH</span></div>
    <div class="lsub">A FICTIONAL SIMULATOR INSPIRED BY WHITE COUNTY, ILLINOIS</div>
    <div class="bar"><i></i></div>
    <div class="ltext" style="color:#6f819b;font-size:.9em">Loading…</div>
    <div class="ldisclaimer">This is an independently developed fictional emergency dispatch simulator inspired by White County, Illinois. It is not affiliated with, endorsed by, or operated by White County or any real emergency services agency.</div>
  </div>
  <noscript><p style="color:#fff;padding:20px">911 Dispatch Simulator needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
