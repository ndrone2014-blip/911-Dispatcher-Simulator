<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="A first-person 3D 911 dispatch simulator that runs in your browser. Answer calls, talk to callers, and manage Police, Fire, EMS and dozens of specialized units.">
  <title>911 Dispatch Simulator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23101826'/><text x='32' y='43' font-size='26' font-family='Arial' font-weight='900' text-anchor='middle' fill='%23ff5a4e'>911</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cad.css">
</head>
<body>
  <div id="app">
    <canvas id="world" aria-label="3D dispatch center"></canvas>
    <div id="hud"></div>
    <div id="mobile-controls" hidden></div>
    <div id="cad" hidden></div>
    <div id="menu" hidden></div>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <div id="loading">
    <div class="logo">911 <span style="color:#ff5a4e">DISPATCH</span></div>
    <div class="bar"><i></i></div>
    <div class="ltext" style="color:#6f819b;font-size:.9em">Loading…</div>
  </div>
  <noscript><p style="color:#fff;padding:20px">911 Dispatch Simulator needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
